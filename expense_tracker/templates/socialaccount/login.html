{% extends 'base.html' %}
{% load static %}
{% load socialaccount %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <div class="position-relative d-inline-block">
                <lord-icon
                    src="{% static 'lordicon/cardswip.json' %}"
                    trigger="loop"
                    state="loop"
                    style="width:80px;height:80px"
                    colors="primary:#4f46e5,secondary:#a5b4fc"
                >
                </lord-icon>
            </div>
            <h2 class="fw-bold mt-3" style="color: var(--text, #111827);">Sign in with Google</h2>
            <p class="text-muted">You are about to sign in using your Google account.</p>
          </div>

          <form method="post">
            {% csrf_token %}
            {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
            {% endif %}
            <button type="submit" class="btn w-100 py-2 fw-medium" style="border: 2px solid var(--border, #e2e8f0); color: var(--text, #111827); background: var(--card, #ffffff);">
              <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 8px; vertical-align: middle;">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Continue with Google
            </button>
          </form>

          <div class="text-center mt-4">
            <p class="text-muted mb-0">
              <a href="{% url 'account_login' %}" class="fw-medium" style="color: var(--primary, #4f46e5);">Back to Sign In</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
