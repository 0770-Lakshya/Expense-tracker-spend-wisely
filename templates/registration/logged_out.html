{% extends 'base.html' %}

{% block title %}Logged Out - Expense Tracker{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-body p-5 text-center">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-4"
               style="width: 72px; height: 72px; background: #ecfdf5;">
            <i class="bi bi-check-circle fs-1" style="color: #059669;"></i>
          </div>
          <h2 class="fw-bold mb-2">You're Logged Out</h2>
          <p class="text-muted mb-4">You have been successfully signed out of your account.</p>
          <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i>Sign In Again
          </a>
          <div class="mt-3">
            <a href="{% url 'signup' %}" class="text-muted small">
              Don't have an account? <span class="fw-medium" style="color: #059669;">Sign up</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
