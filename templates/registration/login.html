{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-indigo-50 rounded-circle mb-3" style="width: 64px; height: 64px;">
              <i class="bi bi-box-arrow-in-right fs-1 text-indigo-600"></i>
            </div>
            <h2 class="fw-bold text-gray-900">Welcome Back</h2>
            <p class="text-muted">Sign in to your expense tracker</p>
          </div>

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_username" class="form-label">Username</label>
              <input type="text" name="username" id="id_username" class="form-control" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="id_password" class="form-label">Password</label>
              <input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password">
            </div>
            {% if form.non_field_errors %}
            <div class="alert alert-danger">
              {% for error in form.non_field_errors %}
              {{ error }}
              {% endfor %}
            </div>
            {% endif %}
            <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
              <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
            </button>
          </form>

          <div class="text-center mt-4">
            <p class="text-muted mb-0">Don't have an account?
              <a href="{% url 'signup' %}" class="fw-medium text-indigo-600">Sign up</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .bg-indigo-50 { background-color: #eef2ff; }
  .text-indigo-600 { color: #4f46e5; }
  .text-gray-900 { color: #111827; }
</style>
{% endblock %}
